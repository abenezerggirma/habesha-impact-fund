<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="bgClassroom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#102A43"/>
      <stop offset="100%" stop-color="#1B435D"/>
    </linearGradient>
    <pattern id="gridArch" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#F8FAFC" stroke-width="0.7" stroke-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#bgClassroom)"/>
  <rect width="1200" height="800" fill="url(#gridArch)"/>
  <!-- Sun & Warm Highland Sky Accent -->
  <circle cx="960" cy="190" r="95" fill="#D6A84B" fill-opacity="0.22"/>
  <circle cx="960" cy="190" r="52" fill="#D6A84B" fill-opacity="0.4"/>
  <!-- Ground Line -->
  <rect x="0" y="610" width="1200" height="190" fill="#0C2135"/>
  <path d="M80 610H1120" stroke="#D6A84B" stroke-width="3" stroke-opacity="0.7"/>
  <!-- Architectural Classroom Building Elevation -->
  <g transform="translate(180, 230)">
    <!-- Roof Structure -->
    <path d="M-30 120L420 10L870 120H-30Z" fill="#16856A" fill-opacity="0.35" stroke="#D6A84B" stroke-width="3"/>
    <path d="M20 120L420 28L820 120" stroke="#F8FAFC" stroke-width="1.5" stroke-opacity="0.4"/>
    <!-- Main Building Body -->
    <rect x="20" y="120" width="800" height="260" fill="#153752" stroke="#F8FAFC" stroke-width="2.5" stroke-opacity="0.85"/>
    <!-- Pillars -->
    <rect x="20" y="120" width="28" height="260" fill="#D6A84B" fill-opacity="0.25"/>
    <rect x="280" y="120" width="24" height="260" fill="#D6A84B" fill-opacity="0.25"/>
    <rect x="536" y="120" width="24" height="260" fill="#D6A84B" fill-opacity="0.25"/>
    <rect x="792" y="120" width="28" height="260" fill="#D6A84B" fill-opacity="0.25"/>
    <!-- Classroom Windows (Bay 1) -->
    <rect x="75" y="165" width="75" height="110" rx="4" fill="#F8FAFC" fill-opacity="0.14" stroke="#D6A84B" stroke-width="2"/>
    <rect x="170" y="165" width="75" height="110" rx="4" fill="#F8FAFC" fill-opacity="0.14" stroke="#D6A84B" stroke-width="2"/>
    <!-- Classroom Door & Window (Bay 2) -->
    <rect x="335" y="165" width="90" height="110" rx="4" fill="#F8FAFC" fill-opacity="0.14" stroke="#D6A84B" stroke-width="2"/>
    <rect x="445" y="185" width="65" height="195" rx="3" fill="#16856A" fill-opacity="0.45" stroke="#F8FAFC" stroke-width="2"/>
    <!-- Classroom Windows (Bay 3) -->
    <rect x="590" y="165" width="75" height="110" rx="4" fill="#F8FAFC" fill-opacity="0.14" stroke="#D6A84B" stroke-width="2"/>
    <rect x="685" y="165" width="75" height="110" rx="4" fill="#F8FAFC" fill-opacity="0.14" stroke="#D6A84B" stroke-width="2"/>
    <!-- Foundation Steps -->
    <rect x="0" y="365" width="840" height="15" fill="#16856A" fill-opacity="0.6"/>
  </g>
  <!-- Architectural Blueprint Label Badge -->
  <g transform="translate(80, 665)">
    <rect width="540" height="54" rx="8" fill="#102A43" stroke="#D6A84B" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="24" y="33" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" letter-spacing="0.06em">
      ARCHITECTURAL CONCEPT • CLASSROOM CONSTRUCTION INITIATIVE
    </text>
  </g>
</svg>
